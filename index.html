<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Solver Engine</title>
  <style>
    :root {
      --bg-color: #121213;
      --card-bg: #1a1a1b;
      --border-color: #3a3a3c;
      --text-main: #ffffff;
      --text-muted: #818384;
      --green: #538d4e;
      --yellow: #b59f3b;
      --gray: #3a3a3c;
      --accent: #ffaa00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 2rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    p.subtitle { font-size: 0.85rem; color: var(--text-muted); }

    /* Layout Wrapper */
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 420px;
    }

    /* Recommendation Banner */
    .recommendation-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      text-align: center;
    }

    .rec-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .rec-word {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--accent);
      margin: 6px 0;
    }

    .rec-meta {
      font-size: 0.8rem;
      color: #d7dedc;
    }

    /* Grid Layout */
    .board {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row {
      display: flex;
      gap: 6px;
    }

    .tile {
      width: 58px;
      height: 58px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    .tile:hover { transform: scale(1.02); }

    /* Tile States */
    .tile.absent { background-color: var(--gray); border-color: var(--gray); color: #fff; }
    .tile.present { background-color: var(--yellow); border-color: var(--yellow); color: #fff; }
    .tile.correct { background-color: var(--green); border-color: var(--green); color: #fff; }

    /* Instructions / Legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.gray { background-color: var(--gray); }
    .dot.yellow { background-color: var(--yellow); }
    .dot.green { background-color: var(--green); }

    /* Action Controls */
    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.2s ease;
    }

    button:hover { opacity: 0.9; }

    .btn-primary { background-color: var(--green); color: white; }
    .btn-secondary { background-color: var(--gray); color: white; }
  </style>
</head>
<body>

  <header>
    <h1>Wordle Solver Engine</h1>
    <p class="subtitle">Click any letter tile to cycle its feedback color</p>
  </header>

  <div class="app-container">
    
    <!-- Top Recommendation Display -->
    <div class="recommendation-card">
      <div class="rec-header">Suggested Guess (Turn <span id="turn-num">1</span>)</div>
      <div class="rec-word" id="best-word">SALET</div>
      <div class="rec-meta" id="stats-text">Default Opening Word (~4.88 Bits)</div>
    </div>

    <!-- 6x5 Grid -->
    <div class="board" id="board"></div>

    <!-- Visual Legend -->
    <div class="legend">
      <div class="legend-item"><span class="dot gray"></span> Gray (Absent)</div>
      <div class="legend-item"><span class="dot yellow"></span> Yellow (Wrong Spot)</div>
      <div class="legend-item"><span class="dot green"></span> Green (Correct Spot)</div>
    </div>

    <!-- Buttons -->
    <div class="actions">
      <button class="btn-primary" onclick="processTurn()">Next Guess</button>
      <button class="btn-secondary" onclick="resetSolver()">Reset</button>
    </div>

  </div>

  <script>
    const DICTIONARY = [
      "SALET", "CRANE", "STALE", "LEASE", "CLASS", "BILLY", "SPITS", "GLASS", "LOGIC", "SMART",
      "CLOUD", "GRAIN", "PLANT", "SHARK", "TRAIN", "FLASH", "PRIME", "STAGE", "REACT", "TRACE",
      "SLATE", "AUDIO", "HOUSE", "RAISE", "PILOT", "SHINE", "MAPLE", "LIGHT", "SWEET", "HEART",
      "WATER", "DREAM", "FLAME", "GREAT", "LEMON", "MUSIC", "NIGHT", "OCEAN", "PEACH", "QUEEN"
    ];

    const DEFAULT_STARTING_WORD = "SALET";
    let candidates = [...DICTIONARY];
    let currentTurn = 0;
    
    // Grid State Initialization
    let boardData = Array(6).fill(null).map(() => 
      Array(5).fill({ char: '', state: 'absent' })
    );

    const boardEl = document.getElementById("board");
    const bestWordEl = document.getElementById("best-word");
    const statsTextEl = document.getElementById("stats-text");
    const turnNumEl = document.getElementById("turn-num");

    function render() {
      boardEl.innerHTML = "";
      for (let r = 0; r < 6; r++) {
        const row = document.createElement("div");
        row.className = "row";
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement("div");
          tile.className = `tile ${boardData[r][c].state}`;
          tile.textContent = boardData[r][c].char;

          // Only allow changing feedback on active rows containing letters
          if (r === currentTurn && boardData[r][c].char !== '') {
            tile.onclick = () => cycleState(r, c);
          }

          row.appendChild(tile);
        }
        boardEl.appendChild(row);
      }
    }

    function cycleState(r, c) {
      const states = ['absent', 'present', 'correct'];
      const nextIndex = (states.indexOf(boardData[r][c].state) + 1) % states.length;
      boardData[r][c] = { ...boardData[r][c], state: states[nextIndex] };
      render();
    }

    function setRow(r, word) {
      for (let c = 0; c < 5; c++) {
        boardData[r][c] = { char: word[c], state: 'absent' };
      }
      render();
    }

    function processTurn() {
      if (currentTurn >= 6) return;

      const guess = boardData[currentTurn].map(t => t.char).join("");
      const pattern = boardData[currentTurn].map(t => t.state);

      // Filter word pool against user feedback
      candidates = candidates.filter(w => checkPattern(guess, w, pattern));

      currentTurn++;
      turnNumEl.textContent = currentTurn + 1;

      if (candidates.length === 0) {
        bestWordEl.textContent = "-----";
        statsTextEl.textContent = "No candidate matches remaining.";
        return;
      }

      // Compute next guess
      const nextWord = candidates[0] || DEFAULT_STARTING_WORD;
      bestWordEl.textContent = nextWord;
      statsTextEl.textContent = `Remaining Candidates: ${candidates.length}`;

      if (currentTurn < 6) {
        setRow(currentTurn, nextWord);
      }
    }

    function checkPattern(guess, word, pattern) {
      const arr = word.split("");

      // 1. Check Greens
      for (let i = 0; i < 5; i++) {
        if (pattern[i] === "correct") {
          if (guess[i] !== arr[i]) return false;
          arr[i] = null;
        }
      }

      // 2. Check Yellows & Grays
      for (let i = 0; i < 5; i++) {
        if (pattern[i] === "present") {
          if (guess[i] === word[i] || !arr.includes(guess[i])) return false;
          arr[arr.indexOf(guess[i])] = null;
        } else if (pattern[i] === "absent") {
          if (arr.includes(guess[i])) return false;
        }
      }

      return true;
    }

    function resetSolver() {
      candidates = [...DICTIONARY];
      currentTurn = 0;
      boardData = Array(6).fill(null).map(() => Array(5).fill({ char: '', state: 'absent' }));

      turnNumEl.textContent = "1";
      bestWordEl.textContent = DEFAULT_STARTING_WORD; // Fixed default
      statsTextEl.textContent = "Default Opening Word (~4.88 Bits)";

      setRow(0, DEFAULT_STARTING_WORD);
    }

    // Initialize layout with SALET on Row 1
    resetSolver();
  </script>
</body>
</html>
