<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Wordle - SALET Engine (No Repeats)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      background-color: #121213;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    #solver-hint {
      font-size: 0.95rem;
      color: #ffaa00;
      margin-bottom: 10px;
      font-weight: bold;
    }
    #message {
      height: 35px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #d7dedc;
      margin-bottom: 15px;
      text-align: center;
    }
    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-gap: 6px;
      margin-bottom: 20px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-gap: 6px;
    }
    .tile {
      width: 52px;
      height: 52px;
      border: 2px solid #3a3a3c;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      transition: transform 0.15s ease, background-color 0.3s ease;
    }
    .tile.pop { transform: scale(1.08); border-color: #565758; }
    
    .correct { background-color: #538d4e !important; border-color: #538d4e !important; color: white; }
    .present { background-color: #b59f3b !important; border-color: #b59f3b !important; color: white; }
    .absent { background-color: #3a3a3c !important; border-color: #3a3a3c !important; color: white; }

    #keyboard { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 500px; }
    .kb-row { display: flex; justify-content: center; gap: 5px; }
    .key {
      background-color: #818384;
      color: white;
      border: none;
      border-radius: 4px;
      height: 55px;
      flex: 1;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      user-select: none;
    }
    .key-large { flex: 1.5; font-size: 0.75rem; }
    .key.correct { background-color: #538d4e; }
    .key.present { background-color: #b59f3b; }
    .key.absent { background-color: #3a3a3c; }

    #restart-btn {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #538d4e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }
    #restart-btn:hover { background-color: #467641; }
  </style>
</head>
<body>

  <h1>MINI WORDLE</h1>
  <div id="solver-hint">Recommended Opening Word: SALET 💡</div>
  <div id="message">Guess the 5-letter word!</div>
  <div id="board"></div>
  <div id="keyboard"></div>
  <button id="restart-btn" onclick="initGame()">NEXT WORD</button>

  <script>
    const WORD_POOL = [
      "SALET", "CRANE", "STALE", "LEASE", "CLASS", "BILLY", "SPITS", "GLASS", "LOGIC", "SMART",
      "CLOUD", "GRAIN", "PLANT", "SHARK", "TRAIN", "FLASH", "PRIME", "STAGE", "REACT", "TRACE",
      "SLATE", "AUDIO", "HOUSE", "RAISE", "PILOT", "SHINE", "MAPLE", "LIGHT", "SWEET", "HEART",
      "WATER", "DREAM", "FLAME", "GREAT", "LEMON", "MUSIC", "NIGHT", "OCEAN", "PEACH", "QUEEN",
      "RIVER", "STONE", "TIGER", "WORLD", "YOUTH", "BRAVE", "CLEAN", "DRIVE", "EARTH", "FRUIT",
      "GREEN", "HAPPY", "IMAGE", "JUICE", "KNIFE", "LUCKY", "MONEY", "NOBLE", "POWER", "ROYAL"
    ];

    const DEFAULT_STARTING_WORD = "SALET";
    let targetWord = "";
    let currentRow = 0;
    let currentTile = 0;
    let isGameOver = false;
    let guesses = [];

    const board = document.getElementById("board");
    const keyboard = document.getElementById("keyboard");
    const messageEl = document.getElementById("message");
    const restartBtn = document.getElementById("restart-btn");
    const solverHintEl = document.getElementById("solver-hint");

    const kbLayout = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["ENTER","Z","X","C","V","B","N","M","DEL"]
    ];

    function getPlayedWords() {
      const stored = localStorage.getItem("wordle_played_words");
      return stored ? JSON.parse(stored) : [];
    }

    function savePlayedWord(word) {
      const played = getPlayedWords();
      if (!played.includes(word)) {
        played.push(word);
        localStorage.setItem("wordle_played_words", JSON.stringify(played));
      }
    }

    function selectUniqueWord() {
      const played = getPlayedWords();
      let availableWords = WORD_POOL.filter(w => !played.includes(w));

      if (availableWords.length === 0) {
        localStorage.removeItem("wordle_played_words");
        availableWords = [...WORD_POOL];
      }

      const selected = availableWords[Math.floor(Math.random() * availableWords.length)];
      savePlayedWord(selected);
      return selected;
    }

    function initGame() {
      targetWord = selectUniqueWord();
      currentRow = 0;
      currentTile = 0;
      isGameOver = false;
      guesses = Array(6).fill("").map(() => Array(5).fill(""));
      messageEl.textContent = "Guess the 5-letter word!";
      solverHintEl.textContent = `Recommended Opening Word: ${DEFAULT_STARTING_WORD} 💡`;
      restartBtn.style.display = "none";

      board.innerHTML = "";
      for (let r = 0; r < 6; r++) {
        const row = document.createElement("div");
        row.className = "row";
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }

      keyboard.innerHTML = "";
      kbLayout.forEach(rowKeys => {
        const row = document.createElement("div");
        row.className = "kb-row";
        rowKeys.forEach(key => {
          const btn = document.createElement("button");
          btn.textContent = key;
          btn.id = `key-${key}`;
          btn.className = `key ${key.length > 1 ? 'key-large' : ''}`;
          btn.onclick = () => handleInput(key);
          row.appendChild(btn);
        });
        keyboard.appendChild(row);
      });
    }

    window.addEventListener("keydown", (e) => {
      if (isGameOver) return;
      if (e.key === "Enter") handleInput("ENTER");
      else if (e.key === "Backspace") handleInput("DEL");
      else if (/^[a-zA-Z]$/.test(e.key)) handleInput(e.key.toUpperCase());
    });

    function handleInput(key) {
      if (isGameOver) return;

      if (key === "DEL") {
        if (currentTile > 0) {
          currentTile--;
          guesses[currentRow][currentTile] = "";
          const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
          tile.textContent = "";
          tile.classList.remove("pop");
        }
      } else if (key === "ENTER") {
        if (currentTile === 5) {
          submitGuess();
        } else {
          messageEl.textContent = "Not enough letters!";
        }
      } else if (currentTile < 5 && key.length === 1) {
        guesses[currentRow][currentTile] = key;
        const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
        tile.textContent = key;
        tile.classList.add("pop");
        currentTile++;
      }
    }

    function submitGuess() {
      const guessWord = guesses[currentRow].join("");
      const targetArr = targetWord.split("");
      const status = Array(5).fill("absent");

      for (let i = 0; i < 5; i++) {
        if (guessWord[i] === targetArr[i]) {
          status[i] = "correct";
          targetArr[i] = null;
        }
      }

      for (let i = 0; i < 5; i++) {
        if (status[i] !== "correct" && targetArr.includes(guessWord[i])) {
          status[i] = "present";
          targetArr[targetArr.indexOf(guessWord[i])] = null;
        }
      }

      for (let i = 0; i < 5; i++) {
        const letter = guessWord[i];
        const tile = document.getElementById(`tile-${currentRow}-${i}`);
        tile.classList.add(status[i]);

        const keyBtn = document.getElementById(`key-${letter}`);
        if (keyBtn) {
          if (status[i] === "correct") {
            keyBtn.className = "key correct";
          } else if (status[i] === "present" && !keyBtn.classList.contains("correct")) {
            keyBtn.className = "key present";
          } else if (status[i] === "absent" && !keyBtn.classList.contains("correct") && !keyBtn.classList.contains("present")) {
            keyBtn.className = "key absent";
          }
        }
      }

      if (guessWord === targetWord) {
        messageEl.innerHTML = "🎉 Splendid! You guessed the word!";
        endGame();
      } else if (currentRow === 5) {
        messageEl.innerHTML = `❌ Game Over! The word was: <b style="color: #ff5555; font-size: 1.3rem;">${targetWord}</b>`;
        endGame();
      } else {
        currentRow++;
        currentTile = 0;
        messageEl.textContent = "";
      }
    }

    function endGame() {
      isGameOver = true;
      restartBtn.style.display = "block";
    }

    initGame();
  </script>
</body>
</html>
