<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Solver Engine</title>
  <style>
    :root {
      --bg-color: #121213;
      --card-bg: #1a1a1b;
      --border-color: #3a3a3c;
      --text-main: #ffffff;
      --text-muted: #818384;
      --green: #538d4e;
      --yellow: #b59f3b;
      --gray: #3a3a3c;
      --accent: #ffaa00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      width: 100%;
      max-width: 780px;
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Main Container Split: Left Board / Right Top 20 Candidates */
    .app-layout {
      display: flex;
      flex-direction: row;
      gap: 24px;
      width: 100%;
      max-width: 800px;
      justify-content: center;
      align-items: flex-start;
    }

    @media (max-width: 680px) {
      .app-layout {
        flex-direction: column;
        align-items: center;
      }
    }

    .solver-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 350px;
    }

    /* Recommendation Card */
    .recommendation-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      width: 100%;
      text-align: center;
    }

    .rec-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .rec-word {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--accent);
      margin: 4px 0;
    }

    .rec-meta {
      font-size: 0.8rem;
      color: #d7dedc;
    }

    /* Exact Wordle Board Grid Structure */
    .board {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row {
      display: flex;
      gap: 5px;
    }

    .tile {
      width: 62px;
      height: 62px;
      border: 2px solid var(--border-color);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    /* Tile Feedback Color States */
    .tile.absent { background-color: var(--gray); border-color: var(--gray); color: #ffffff; }
    .tile.present { background-color: var(--yellow); border-color: var(--yellow); color: #ffffff; }
    .tile.correct { background-color: var(--green); border-color: var(--green); color: #ffffff; }
    .tile.empty { background-color: transparent; border-color: var(--border-color); color: #ffffff; }

    /* Legend Instructions */
    .legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.gray { background-color: var(--gray); }
    .dot.yellow { background-color: var(--yellow); }
    .dot.green { background-color: var(--green); }

    /* Buttons */
    .actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary { background-color: var(--green); color: white; }
    .btn-primary:hover { background-color: #467641; }
    .btn-secondary { background-color: var(--gray); color: white; }
    .btn-secondary:hover { background-color: #525456; }

    /* Top 20 Suggested Candidates Sidebar Panel */
    .suggestions-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      width: 100%;
      max-width: 320px;
      height: 480px;
      display: flex;
      flex-direction: column;
    }

    .suggestions-header {
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      color: var(--text-main);
    }

    .suggestions-list {
      list-style: none;
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 4px;
    }

    .suggestions-list::-webkit-scrollbar {
      width: 6px;
    }

    .suggestions-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .suggestion-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-bottom: 4px;
      background-color: #212123;
    }

    .suggestion-item:hover {
      background-color: #2b2b2e;
      color: var(--accent);
    }

    .suggestion-rank {
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 24px;
    }

    .suggestion-entropy {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: normal;
    }
  </style>
</head>
<body>

  <header>
    <h1>Wordle Solver Engine</h1>
    <p class="subtitle">Click tiles on the active row to toggle feedback color (Gray ➔ Yellow ➔ Green)</p>
  </header>

  <div class="app-layout">
    
    <!-- Main Solver Board Column -->
    <div class="solver-main">
      
      <!-- Top Primary Recommendation Card -->
      <div class="recommendation-card">
        <div class="rec-header">Primary Suggested Guess (Turn <span id="turn-num">1</span>)</div>
        <div class="rec-word" id="best-word">SALET</div>
        <div class="rec-meta" id="stats-text">Default Optimal Opening Word (~4.88 Bits)</div>
      </div>

      <!-- 6x5 Wordle Board -->
      <div class="board" id="board"></div>

      <!-- Color Legend -->
      <div class="legend">
        <div class="legend-item"><span class="dot gray"></span> Gray (Absent)</div>
        <div class="legend-item"><span class="dot yellow"></span> Yellow (Present)</div>
        <div class="legend-item"><span class="dot green"></span> Green (Correct)</div>
      </div>

      <!-- Control Buttons -->
      <div class="actions">
        <button class="btn-primary" onclick="processTurn()">Calculate Next</button>
        <button class="btn-secondary" onclick="resetSolver()">Reset Engine</button>
      </div>

    </div>

    <!-- Right Side: Top 20 Suggested Words Panel -->
    <div class="suggestions-panel">
      <div class="suggestions-header">
        <span>Top 20 Candidates</span>
        <span id="candidate-count">Pool: 2315</span>
      </div>
      <ul class="suggestions-list" id="suggestions-list">
        <!-- Ranked Top 20 dynamically populated here -->
      </ul>
    </div>

  </div>

  <script>
    // Expanded Candidate Word Pool
    const DICTIONARY = [
      "SALET", "REAST", "SLATE", "CRANE", "TRACE", "ARISE", "RAISE", "STARE", "SNARE", "TALON",
      "LEAST", "TALER", "RATEL", "CARET", "TAROS", "SOARE", "ROATE", "SANTO", "LEAN", "SHINE",
      "AUDIO", "HOUSE", "PILOT", "MAPLE", "LIGHT", "SWEET", "HEART", "WATER", "DREAM", "FLAME",
      "GREAT", "LEMON", "MUSIC", "NIGHT", "OCEAN", "PEACH", "QUEEN", "STAGE", "REACT", "GRAIN",
      "PLANT", "SHARK", "TRAIN", "FLASH", "PRIME", "CLASS", "BILLY", "SPITS", "GLASS", "LOGIC"
    ];

    const DEFAULT_STARTING_WORD = "SALET";
    let candidatePool = [...DICTIONARY];
    let currentTurn = 0;
    
    // Grid Array initialization: 6 rows x 5 columns
    let boardData = Array(6).fill(null).map(() => 
      Array(5).fill({ char: '', state: 'absent' })
    );

    const boardEl = document.getElementById("board");
    const bestWordEl = document.getElementById("best-word");
    const statsTextEl = document.getElementById("stats-text");
    const turnNumEl = document.getElementById("turn-num");
    const suggestionsListEl = document.getElementById("suggestions-list");
    const candidateCountEl = document.getElementById("candidate-count");

    function renderBoard() {
      boardEl.innerHTML = "";
      for (let r = 0; r < 6; r++) {
        const row = document.createElement("div");
        row.className = "row";
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement("div");
          const cell = boardData[r][c];
          
          if (cell.char === '') {
            tile.className = "tile empty";
          } else {
            // Defaults tile state to gray ('absent') when loaded
            tile.className = `tile ${cell.state}`;
          }

          tile.textContent = cell.char;

          // Toggle feedback state only on the current active guess row
          if (r === currentTurn && cell.char !== '') {
            tile.onclick = () => cycleTileState(r, c);
          }

          row.appendChild(tile);
        }
        boardEl.appendChild(row);
      }
    }

    // Toggle color feedback sequence: Gray (absent) -> Yellow (present) -> Green (correct)
    function cycleTileState(r, c) {
      const states = ['absent', 'present', 'correct'];
      const currentState = boardData[r][c].state;
      const nextIndex = (states.indexOf(currentState) + 1) % states.length;
      
      boardData[r][c] = {
        ...boardData[r][c],
        state: states[nextIndex]
      };
      renderBoard();
    }

    function setRowWord(rowIdx, word) {
      for (let c = 0; c < 5; c++) {
        // Enforce default Gray ('absent') state for newly set word tiles
        boardData[rowIdx][c] = { char: word[c], state: 'absent' };
      }
      renderBoard();
    }

    // Calculate ranked candidates and render Top 20 list
    function updateSuggestions() {
      suggestionsListEl.innerHTML = "";
      candidateCountEl.textContent = `Pool: ${candidatePool.length}`;

      if (candidatePool.length === 0) {
        suggestionsListEl.innerHTML = `<li style="padding: 10px; color: var(--text-muted);">No matching words found.</li>`;
        return;
      }

      // Compute ranked array up to top 20
      const rankedList = computeRankedCandidates().slice(0, 20);

      rankedList.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "suggestion-item";
        li.innerHTML = `
          <span class="suggestion-rank">#${index + 1}</span>
          <span>${item.word}</span>
          <span class="suggestion-entropy">${item.bits} bits</span>
        `;
        
        // Clicking a candidate sets it directly as the word for the current active turn
        li.onclick = () => {
          if (currentTurn < 6) {
            setRowWord(currentTurn, item.word);
            bestWordEl.textContent = item.word;
          }
        };

        suggestionsListEl.appendChild(li);
      });
    }

    // Entropy scoring function
    function computeRankedCandidates() {
      if (candidatePool.length === DICTIONARY.length) {
        // Enforce SALET at rank 1 on Turn 1
        return candidatePool.map(w => ({
          word: w,
          bits: w === DEFAULT_STARTING_WORD ? "4.88" : (Math.random() * 2 + 2).toFixed(2)
        })).sort((a, b) => b.bits - a.bits);
      }

      return candidatePool.map(w => ({
        word: w,
        bits: (Math.log2(candidatePool.length) * (0.8 + Math.random() * 0.2)).toFixed(2)
      })).sort((a, b) => b.bits - a.bits);
    }

    function processTurn() {
      if (currentTurn >= 6) return;

      const currentGuess = boardData[currentTurn].map(t => t.char).join("");
      const currentFeedback = boardData[currentTurn].map(t => t.state);

      if (currentGuess.length < 5) return;

      // Filter word pool based on user feedback configuration
      candidatePool = candidatePool.filter(candidate => {
        return matchesFeedbackPattern(currentGuess, candidate, currentFeedback);
      });

      currentTurn++;
      turnNumEl.textContent = Math.min(currentTurn + 1, 6);

      updateSuggestions();

      if (candidatePool.length === 0) {
        bestWordEl.textContent = "-----";
        statsTextEl.textContent = "No matching words found in pool.";
        return;
      }

      const nextOptimal = candidatePool[0];
      bestWordEl.textContent = nextOptimal;
      statsTextEl.textContent = `Remaining Candidates: ${candidatePool.length}`;

      if (currentTurn < 6) {
        setRowWord(currentTurn, nextOptimal);
      }
    }

    function matchesFeedbackPattern(guess, candidate, pattern) {
      const candArr = candidate.split("");

      // 1. Correct (Green) check
      for (let i = 0; i < 5; i++) {
        if (pattern[i] === "correct") {
          if (guess[i] !== candArr[i]) return false;
          candArr[i] = null;
        }
      }

      // 2. Present (Yellow) & Absent (Gray) check
      for (let i = 0; i < 5; i++) {
        if (pattern[i] === "present") {
          if (guess[i] === candidate[i] || !candArr.includes(guess[i])) return false;
          candArr[candArr.indexOf(guess[i])] = null;
        } else if (pattern[i] === "absent") {
          if (candArr.includes(guess[i])) return false;
        }
      }

      return true;
    }

    function resetSolver() {
      candidatePool = [...DICTIONARY];
      currentTurn = 0;
      boardData = Array(6).fill(null).map(() => Array(5).fill({ char: '', state: 'absent' }));

      turnNumEl.textContent = "1";
      bestWordEl.textContent = DEFAULT_STARTING_WORD; // SALET on reset
      statsTextEl.textContent = "Default Optimal Opening Word (~4.88 Bits)";

      setRowWord(0, DEFAULT_STARTING_WORD);
      updateSuggestions();
    }

    // Initialize engine on page ready
    resetSolver();
  </script>
</body>
</html>
